version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zerodotemail
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-proxy:
    image: hiett/serverless-redis-http:latest
    restart: unless-stopped
    environment:
      SRH_MODE: env
      SRH_TOKEN: upstash-local-token
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && cd apps/server && pnpm db:push && pnpm dev"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-8787}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/zerodotemail}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - COOKIE_DOMAIN=${COOKIE_DOMAIN}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - MICROSOFT_CLIENT_ID=${MICROSOFT_CLIENT_ID:-}
      - MICROSOFT_CLIENT_SECRET=${MICROSOFT_CLIENT_SECRET:-}
      - REDIS_URL=${REDIS_URL:-http://redis-proxy:80}
      - REDIS_TOKEN=${REDIS_TOKEN:-upstash-local-token}
      - VITE_PUBLIC_APP_URL=${VITE_PUBLIC_APP_URL}
      - VITE_PUBLIC_BACKEND_URL=${VITE_PUBLIC_BACKEND_URL}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/server/node_modules
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
      redis-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8787/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && cd apps/mail && pnpm dev"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - VITE_PUBLIC_APP_URL=${VITE_PUBLIC_APP_URL}
      - VITE_PUBLIC_BACKEND_URL=${VITE_PUBLIC_BACKEND_URL}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/mail/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
